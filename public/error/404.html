<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - 구조를 찾을 수 없습니다</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="/error/404.css">
</head>
<body>

<!-- ─── NAV ─── -->
<nav>
  <a class="nav-logo" href="/">
    <svg class="scissor-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">
      <circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/>
      <line x1="20" y1="4" x2="8.12" y2="15.88"/>
      <line x1="14.47" y1="14.48" x2="20" y2="20"/>
      <line x1="8.12" y1="8.12" x2="12" y2="12"/>
    </svg>
    CHISA BOT
  </a>
</nav>

<div class="error-container">
  <div class="scissor-stage">
    <div class="scissor-ring"></div>
  </div>

  <div class="error-code">404</div>
  <h1 class="error-message">분석 불가능한 영역이에요.</h1>
  <p class="error-hint">
    요청하신 데이터의 구조가 존재하지 않거나 잘못된 경로입니다.<br>
    치사의 가위로도 이 공간은 재단할 수 없겠네요.
  </p>
  <div class="hero-actions">
    <a href="/" class="btn-primary">✦ 메인으로 돌아가기</a>
  </div>
</div>

<!-- ─── FOOTER ─── -->
<footer>
  <div class="footer-inner">
    <div class="footer-logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#cd2929" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/>
        <line x1="20" y1="4" x2="8.12" y2="15.88"/>
        <line x1="14.47" y1="14.48" x2="20" y2="20"/>
        <line x1="8.12" y1="8.12" x2="12" y2="12"/>
      </svg>
      CHISA BOT
    </div>
    <div class="footer-copy">✂ CHISA Project · Analysis Failed</div>
  </div>
</footer>

</html>
