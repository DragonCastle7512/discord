<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>치사 봇 — Discord Assistant</title>
<link rel="stylesheet" href="/dashboard/dashboard.css">
</head>
<body>
<div class="wrap" style="min-height:100vh;">
  <div class="topbar">
    <div class="logo">
      <span class="logo-desktop">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
        Dashboard
      </span>
      <button id="menu-toggle-btn" class="menu-toggle-btn" aria-label="메뉴 열기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="server-info">
      <div class="server-dot"></div>
      <span class="server-name">나의 서버</span>
      <!-- <span class="server-img"></span> -->
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="user-av" >나</div>
    </div>
  </div>

  <div class="sidebar">
    <div class="nav-section">
      <div class="nav-label">메인</div>
      <div class="nav-item active" id="menu-dashboard" onclick="switchTab('dashboard')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        대시보드
      </div>
      <div class="nav-item" id="menu-admin" onclick="switchTab('admin')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
        키워드 관리
      </div>
    </div>
  </div>

  <div class="main">
    <div id="dashboard-view">
      <!-- NOW PLAYING -->
      <div class="now-playing" id="now-playing-section">
        <div class="thumb">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        </div>
        <div class="np-info">
          <div class="np-badge">▶ NOW PLAYING</div>
          <div class="np-title">재생 중인 곡 없음</div>
          <div class="np-artist">-</div>
          <div class="progress-wrap">
            <div class="progress-bar">
              <div class="progress-fill"></div>
              <div class="progress-dot"></div>
            </div>
            <div class="progress-times"><span>0:00</span><span>0:00</span></div>
          </div>
          <div class="np-controls">
            <button class="ctrl-btn" onclick="sendControl('addPlaylist')" title="플레이리스트에 추가">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <button class="ctrl-btn" onclick="sendControl('previous')" title="이전">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"/></svg>
            </button>
            <button class="ctrl-btn play" id="playBtn" onclick="togglePlay()" title="재생/일시정지">
              <svg id="playIcon" viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
            </button>
            <button class="ctrl-btn" onclick="sendControl('skip')" title="다음">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"/></svg>
            </button>
            <button class="ctrl-btn" onclick="sendControl('loop')" title="반복">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
            </button>
            <div style="flex:1;"></div>
            <div class="vol-area">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
              <input type="range" min="0" max="100" value="60">
            </div>
          </div>
        </div>
        <div class="np-requester">
          <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">요청자</div>
          <div style="display:flex;align-items:center;gap:6px;justify-content:flex-end;">
            <div class="req-av-wrap" style="width:30px;height:30px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:10px;overflow:hidden;">나</div>
          </div>
        </div>
      </div>

      <!-- STATS -->
      <div class="stats-row" id="stats-section">
        <div class="stat-card">
          <div class="stat-val">-</div>
          <div class="stat-label">대기열 곡 수</div>
        </div>
        <div class="stat-card">
          <div class="stat-val">-</div>
          <div class="stat-label">오늘 재생 수</div>
        </div>
        <div class="stat-card">
          <div class="stat-val">-</div>
          <div class="stat-label">내 플레이리스트</div>
        </div>
      </div>

      <!-- QUEUE + TRENDING -->
      <div class="grid2">
        <!-- QUEUE -->
        <div class="card" id="queue-section">
          <div class="section-title">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--red)" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            재생 큐 <span>-곡</span>
            <div style="margin-left:auto;display:flex;gap:6px;">
              <button class="section-icon-btn" onclick="sendControl('shuffle')" title="대기열 셔플" aria-label="대기열 셔플">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
              </button>
            </div>
          </div>
          <div class="queue-list scrollable" id="queueList"></div>
        </div>

        <!-- TRENDING -->
        <div class="card" id="trending-section">
          <div class="section-title">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--red)" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
            서버 인기 차트 <span>이번 주</span>
          </div>
          <div class="trend-list scrollable" id="trendList"></div>
        </div>
      </div>

      <!-- PLAYLISTS -->
      <div class="card" id="playlist-section">
        <div class="section-title">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--red)" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          내 플레이리스트
        </div>
        <div class="pl-grid" id="playlistGrid"></div>
      </div>
    </div>

    <!-- ADMIN VIEW (키워드 관리) -->
    <div id="admin-view" style="display: none;">
      <div class="keyword-mode-selector">
        <button id="btn-mode-server" class="mode-btn active" onclick="setKeywordMode('server')">서버 키워드</button>
        <button id="btn-mode-personal" class="mode-btn" onclick="setKeywordMode('personal')">개인 키워드</button>
      </div>

      <!-- RECOMMENDATION PREVIEW CARD (추천 곡 미리보기) -->
      <div class="card" style="margin-bottom: 24px;">
        <div class="section-title" id="recommendationCardTitle">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--red)" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          서버 추천 곡 미리보기
        </div>
        <div class="recommendation-cards" id="recommendationResultContainer">
          <div style="color: var(--muted); font-size: 13px; text-align: center; padding: 40px 0; width: 100%;">충분한 키워드 데이터가 쌓이면 추천 곡이 나타납니다.</div>
        </div>
      </div>

      <div class="grid2">
        <!-- BLACKLIST MANAGEMENT -->
        <div class="card">
          <div class="section-title">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--red)" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            키워드 직접 차단
          </div>
          <div class="blacklist-add-form">
            <input type="text" id="blacklist-input" placeholder="차단할 키워드 입력..." />
            <button onclick="addBlacklistFromInput()">차단 추가</button>
          </div>

          <div class="section-title" style="margin-top: 24px;">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--red)" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            현재 차단된 키워드 목록
          </div>
          <div class="blacklist-chips scrollable" id="blacklistChips"></div>
        </div>

        <!-- KEYWORDS LIST -->
        <div class="card">
          <div class="section-title">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--red)" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            수집 키워드 빈도 순위
            <div class="keyword-search-form">
              <input type="text" id="keyword-search-input" oninput="filterKeywordsTable()" placeholder="키워드 검색..." />
            </div>
          </div>
          <div class="queue-list scrollable" style="height: 400px;">
            <table class="keyword-table">
              <thead>
                <tr>
                  <th>순위</th>
                  <th>키워드</th>
                  <th>빈도수</th>
                  <th>관리</th>
                </tr>
              </thead>
              <tbody id="keywordTableBody">
                <!-- 동적 렌더링 -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- SEARCH PREVIEW CARD (유튜브 검색 미리보기) -->
      <div class="card" style="margin-top: 24px;">
        <div class="section-title">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--red)" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          검색 결과 확인 (유튜브 검색 미리보기)
        </div>
        <div class="blacklist-add-form">
          <input type="text" id="preview-search-input" placeholder="유튜브 검색어 입력 (예: 버즈)..." onkeydown="if(event.key === 'Enter') searchPreviewKeywords()" />
          <button onclick="searchPreviewKeywords()">검색</button>
        </div>
        <div class="queue-list scrollable" style="max-height: 450px; margin-top: 12px;" id="previewResultContainer">
          <div style="color: var(--muted); font-size: 13px; text-align: center; padding: 40px 0;">검색어를 입력하고 검색 버튼을 눌러주세요.</div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/dashboard/dashboard.js"></script>
</body>
</html>
