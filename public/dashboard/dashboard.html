<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>치사 봇 — Discord Assistant</title>
<link rel="stylesheet" href="/dashboard/dashboard.css">
</head>
<body>
<div class="wrap" style="min-height:100vh;">
  <div class="topbar">
    <div class="logo">
      <span class="logo-desktop">
        <i data-icon="logo"></i>
        Dashboard
      </span>
      <button id="menu-toggle-btn" class="menu-toggle-btn" aria-label="메뉴 열기">
        <i data-icon="menu"></i>
      </button>
    </div>
    <div class="server-info">
      <div class="server-dot"></div>
      <span class="server-name">나의 서버</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="user-av" >나</div>
    </div>
  </div>

  <div class="sidebar">
    <div class="nav-section">
      <div class="nav-label">메인</div>
      <div class="nav-item active" id="menu-dashboard">
        <i data-icon="dashboard"></i>
        대시보드
      </div>
      <div class="nav-item" id="menu-admin">
        <i data-icon="admin"></i>
        키워드 관리
      </div>
    </div>
  </div>

  <div class="main">
    <div id="dashboard-view">
      <!-- NOW PLAYING -->
      <div class="now-playing" id="now-playing-section">
        <div class="thumb">
          <i data-icon="music"></i>
        </div>
        <div class="np-info">
          <div class="np-badge">▶ NOW PLAYING</div>
          <div class="np-title">재생 중인 곡 없음</div>
          <div class="np-artist">-</div>
          <div class="progress-wrap">
            <div class="progress-bar">
              <div class="progress-fill"></div>
              <div class="progress-dot"></div>
            </div>
            <div class="progress-times"><span>0:00</span><span>0:00</span></div>
          </div>
          <div class="np-controls">
            <button class="ctrl-btn" id="addPlaylistBtn" title="플레이리스트에 추가">
              <i data-icon="plus"></i>
            </button>
            <button class="ctrl-btn" id="prevBtn" title="이전">
              <i data-icon="previous"></i>
            </button>
            <button class="ctrl-btn play" id="playBtn" title="재생/일시정지">
              <i id="playIcon" data-icon="pause"></i>
            </button>
            <button class="ctrl-btn" id="skipBtn" title="다음">
              <i data-icon="skip"></i>
            </button>
            <button class="ctrl-btn" id="loopBtn" title="반복">
              <i data-icon="loop"></i>
            </button>
            <div style="flex:1;"></div>
            <div class="vol-area">
              <i data-icon="volume"></i>
              <input type="range" id="volumeRange" min="0" max="100" value="60">
            </div>
          </div>
        </div>
        <div class="np-requester">
          <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">요청자</div>
          <div style="display:flex;align-items:center;gap:6px;justify-content:flex-end;">
            <div class="req-av-wrap" style="width:30px;height:30px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:10px;overflow:hidden;">나</div>
          </div>
        </div>
      </div>

      <!-- STATS -->
      <div class="stats-row" id="stats-section">
        <div class="stat-card">
          <div class="stat-val">-</div>
          <div class="stat-label">대기열 곡 수</div>
        </div>
        <div class="stat-card">
          <div class="stat-val">-</div>
          <div class="stat-label">오늘 재생 수</div>
        </div>
        <div class="stat-card">
          <div class="stat-val">-</div>
          <div class="stat-label">내 플레이리스트</div>
        </div>
      </div>

      <!-- QUEUE + TRENDING -->
      <div class="grid2">
        <!-- QUEUE -->
        <div class="card" id="queue-section">
          <div class="section-title">
            <i data-icon="queue"></i>
            재생 큐 <span>-곡</span>
            <div style="margin-left:auto;display:flex;gap:6px;">
              <button class="section-icon-btn" id="shuffleBtn" title="대기열 셔플" aria-label="대기열 셔플">
                <i data-icon="shuffle"></i>
              </button>
            </div>
          </div>
          <div class="queue-list scrollable" id="queueList"></div>
        </div>

        <!-- TRENDING -->
        <div class="card" id="trending-section">
          <div class="section-title">
            <i data-icon="trending"></i>
            서버 인기 차트 <span>이번 주</span>
          </div>
          <div class="trend-list scrollable" id="trendList"></div>
        </div>
      </div>

      <!-- PLAYLISTS -->
      <div class="card" id="playlist-section">
        <div class="section-title">
          <i data-icon="music"></i>
          내 플레이리스트
        </div>
        <div class="pl-grid" id="playlistGrid"></div>
      </div>
    </div>

    <!-- ADMIN VIEW (키워드 관리) -->
    <div id="admin-view" style="display: none;">
      <div class="keyword-mode-selector">
        <button id="btn-mode-server" class="mode-btn active">서버 키워드</button>
        <button id="btn-mode-personal" class="mode-btn">개인 키워드</button>
      </div>

      <!-- RECOMMENDATION PREVIEW CARD (추천 곡 미리보기) -->
      <div class="card" style="margin-bottom: 24px;">
        <div class="section-title" id="recommendationCardTitle">
          <i data-icon="recommend"></i>
          서버 추천 곡 미리보기
        </div>
        <div class="recommendation-cards" id="recommendationResultContainer">
          <div style="color: var(--muted); font-size: 13px; text-align: center; padding: 40px 0; width: 100%;">충분한 키워드 데이터가 쌓이면 추천 곡이 나타납니다.</div>
        </div>
      </div>

      <div class="grid2">
        <!-- BLACKLIST MANAGEMENT -->
        <div class="card">
          <div class="section-title">
            <i data-icon="lock"></i>
            키워드 직접 차단
          </div>
          <div class="blacklist-add-form">
            <input type="text" id="blacklist-input" placeholder="차단할 키워드 입력..." />
            <button id="blacklistAddBtn">차단 추가</button>
          </div>

          <div class="section-title" style="margin-top: 24px;">
            <i data-icon="shield"></i>
            현재 차단된 키워드 목록
          </div>
          <div class="blacklist-chips scrollable" id="blacklistChips"></div>
        </div>

        <!-- KEYWORDS LIST -->
        <div class="card">
          <div class="section-title">
            <i data-icon="queue"></i>
            수집 키워드 빈도 순위
            <div class="keyword-search-form">
              <input type="text" id="keyword-search-input" placeholder="키워드 검색..." />
            </div>
          </div>
          <div class="queue-list scrollable" style="height: 400px;">
            <table class="keyword-table">
              <thead>
                <tr>
                  <th>순위</th>
                  <th>키워드</th>
                  <th>빈도수</th>
                  <th>관리</th>
                </tr>
              </thead>
              <tbody id="keywordTableBody">
                <!-- 동적 렌더링 -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- SEARCH PREVIEW CARD (유튜브 검색 미리보기) -->
      <div class="card" style="margin-top: 24px;">
        <div class="section-title">
          <i data-icon="search"></i>
          검색 결과 확인 (유튜브 검색 미리보기)
        </div>
        <div class="blacklist-add-form">
          <input type="text" id="preview-search-input" placeholder="유튜브 검색어 입력 (예: 버즈)..." />
          <button id="previewSearchBtn">검색</button>
        </div>
        <div class="queue-list scrollable" style="max-height: 450px; margin-top: 12px;" id="previewResultContainer">
          <div style="color: var(--muted); font-size: 13px; text-align: center; padding: 40px 0;">검색어를 입력하고 검색 버튼을 눌러주세요.</div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/dashboard/dashboard.js"></script>
</body>
</html>
