<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>치사 봇 — Admin Page</title>
<link rel="stylesheet" href="/dashboard/dashboard.css">
<link rel="stylesheet" href="/logs/logs.css">
</head>
<body>
<div class="wrap" style="min-height:100vh;">
  <!-- TOPBAR -->
  <div class="topbar">
    <div class="logo">
      <span class="logo-desktop">
        <i data-icon="logo"></i>
        Admin Page
      </span>
      <button id="menu-toggle-btn" class="menu-toggle-btn" aria-label="메뉴 열기">
        <i data-icon="menu"></i>
      </button>
    </div>

    <div style="display:flex;align-items:center;gap:12px;">
      <div class="user-av" style="overflow: hidden;">A</div>
    </div>
  </div>

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="nav-section">
      <div class="nav-label">메뉴</div>
      <div class="nav-item active" id="menu-logs">
        <i data-icon="queue"></i>
        시스템 로그
      </div>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main">
    <div class="card">
      <div class="section-title">
        <i data-icon="shield"></i>
        시스템 작동 로그
        <span id="log-count-badge">0개의 로그</span>
      </div>

      <!-- FILTERS -->
      <div class="filter-row">
        <div class="filter-item">
          <select id="level-filter" class="filter-select">
            <option value="ALL">모든 레벨</option>
            <option value="INFO">INFO</option>
            <option value="WARN">WARN</option>
            <option value="ERROR">ERROR</option>
          </select>
        </div>
        <div class="filter-item">
          <input type="text" id="search-input" class="filter-input" placeholder="메시지, 카테고리 검색..." />
        </div>
        <div class="filter-item">
          <select id="limit-filter" class="filter-select">
            <option value="100">최근 100개</option>
            <option value="300">최근 300개</option>
            <option value="500">최근 500개</option>
            <option value="ALL">전체 로그</option>
          </select>
        </div>
        <div style="flex:1;"></div>
        <button id="reload-btn" class="reload-btn">
          새로고침
        </button>
      </div>

      <!-- LOG TABLE -->
      <div class="scrollable" style="max-height: calc(100vh - 250px); overflow-y: auto; overflow-x: auto; width: 100%;">
        <table class="logs-table">
          <thead>
            <tr>
              <th style="width: 140px;">시간</th>
              <th style="width: 80px;">레벨</th>
              <th style="width: 120px;">카테고리</th>
              <th>메시지</th>
            </tr>
          </thead>
          <tbody id="logs-tbody">
            <!-- 동적 렌더링 -->
          </tbody>
        </table>
        <div id="empty-message" class="empty-state" style="display:none;">
          조건에 일치하는 시스템 로그가 없습니다.
        </div>
      </div>
    </div>
  </div>
</div>

<div class="sidebar-overlay" id="sidebar-overlay"></div>

<script type="module" src="/logs/logs.js"></script>
</body>
</html>
